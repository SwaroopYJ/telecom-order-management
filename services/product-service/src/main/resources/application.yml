
spring:
  application:
    name: product-service

  profiles:
    active: local

server:
  port: 8082

info:
  app:
    name: Product Catalogue Service
    description: Telecom OMS Product Catalogue and Pricing Microservice
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true

  info:
    env:
      enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
