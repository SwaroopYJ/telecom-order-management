
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/oms_catalogue
    username: ${CATALOGUE_DB_USERNAME}
    password: ${CATALOGUE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.telecom.oms.product: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [CID:%X{correlationId:-}] [%logger{36}] - %msg%n"
